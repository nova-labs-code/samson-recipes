<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samson Recipes Analytics</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --primary-color: #1c52b9;  /* original blue */
    --accent-color: #4CAF50;
    --bg-color: #4D4543;
    --card-bg: #ffffff;
    --shadow-light: rgba(0,0,0,0.05);
    --shadow-dark: rgba(0,0,0,0.15);
    --glow-color: rgba(28,82,185,0.5);
}

body {
    font-family: 'Inter', sans-serif;
    background-color: var(--bg-color);
    color: #333;
    padding: 40px 20px;
}

h1 {
    text-align: center;
    color: var(--primary-color);
    font-size: 2.5rem;
    margin-bottom: 50px;
    font-weight: 700;
    text-shadow: none; /* removed extra blue */
}

#goalLabel {
    color: #ffffff; /* bright white for readability */
    font-weight: 600;
    font-size: 1.2rem;
    text-align: center;
    margin-bottom: 20px;
    text-shadow: 0 0 6px rgba(0,0,0,0.6);
}

.data-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 30px;
    max-width: 1200px;
    margin: 0 auto 20px;
}

.data-item {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 30px 25px;
    box-shadow: 0 10px 30px var(--shadow-light), 0 0 15px rgba(28,82,185,0.15);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    position: relative;
    overflow: hidden;
}

.data-item:hover {
    transform: translateY(-10px);
    box-shadow: 0 20px 40px var(--shadow-dark), 0 0 20px var(--glow-color);
}

.data-item::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    height: 6px;
    width: 100%;
    background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
    border-top-left-radius: 16px;
    border-top-right-radius: 16px;
    box-shadow: 0 0 10px var(--primary-color);
}

.data-item .key {
    font-weight: 600;
    font-size: 0.85rem;
    color: var(--primary-color);
    display: flex;
    align-items: center;
    gap: 10px;
    text-transform: uppercase;
    letter-spacing: 0.7px;
    margin-bottom: 15px;
    text-shadow: none; /* removed blue glow */
}

.data-item .value {
    font-weight: 700;
    font-size: 2rem;
    color: #222;
    line-height: 1.2;
    text-shadow: none;
}

.data-item.date .value {
    color: var(--accent-color);
    text-shadow: 0 0 6px rgba(76,175,80,0.3);
}

.chart-container {
    max-width: 1200px;
    margin: 30px auto;
    background: var(--card-bg);
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 10px 30px var(--shadow-light), 0 0 15px rgba(28,82,185,0.15);
    text-align: center;
}

.milestone-chart {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 20px 0;
    position: relative;
}

.milestone-chart::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 5%;
    width: 90%;
    height: 4px;
    background: #ddd;
    transform: translateY(-50%);
    z-index: 1;
    border-radius: 2px;
}

.milestone-step {
    position: relative;
    z-index: 2;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #ddd;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    transition: 0.3s;
}

.milestone-step.completed {
    background: var(--accent-color);
}

.milestone-labels {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
}

#milestoneContainer {
    text-align: center;
    margin-top: 20px;
    display: none;
}

#milestoneCanvas {
    max-width: 90%;
    border-radius: 16px;
    box-shadow: 0 0 30px rgba(0,0,0,0.3);
}

#downloadMilestone {
    margin-top: 10px;
    padding: 10px 20px;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    background: var(--accent-color);
    color: #000;
    cursor: pointer;
    transition: 0.3s;
}

#downloadMilestone:hover {
    background: #43a047;
}

@media (max-width: 600px){
    h1 { font-size: 2rem; margin-bottom: 30px; }
    .data-item .value { font-size: 1.6rem; }
    #goalLabel { font-size: 1rem; }
}
</style>
</head>

<body>

<h1>Samson Recipes Analytics</h1>

<div id="data-display" class="data-container"></div>
<div id="goalLabel" class="goal-label"></div>

<div class="chart-container">
    <h2>Milestone Progress</h2>
    <div id="milestoneChart" class="milestone-chart"></div>
    <div class="milestone-labels" id="milestoneLabels"></div>
</div>

<div id="milestoneContainer">
    <canvas id="milestoneCanvas"></canvas>
    <br>
    <button id="downloadMilestone">Download Milestone Image</button>
</div>

<script>
/* ======= Stats & Milestones ======= */
const SITE_NAME = "samson-recipes";
const MILESTONES_INPUT = ["50k","100k","150k","250k","500k","1M"];
const MILESTONES = MILESTONES_INPUT.map(parseNumber);
const UPDATE_INTERVAL = 3000;

const displayElement = document.getElementById('data-display');
const goalLabel = document.getElementById('goalLabel');
const milestoneCanvas = document.getElementById('milestoneCanvas');
const downloadBtn = document.getElementById('downloadMilestone');
const milestoneContainer = document.getElementById('milestoneContainer');
const milestoneChartEl = document.getElementById('milestoneChart');
const milestoneLabelsEl = document.getElementById('milestoneLabels');

let milestonesReached = JSON.parse(localStorage.getItem("milestonesReached") || "[]");
let currentMilestoneIndex = MILESTONES.findIndex(m => !milestonesReached.includes(m));
if(currentMilestoneIndex === -1) currentMilestoneIndex = MILESTONES.length;

function parseNumber(str){
    if(typeof str==='number') return str;
    str = str.toLowerCase();
    if(str.endsWith('k')) return parseFloat(str)*1e3;
    if(str.endsWith('m')) return parseFloat(str)*1e6;
    return parseFloat(str);
}

function formatNumber(n){
    if(n >= 1e6) return (n/1e6).toFixed(1).replace('.0','')+'M';
    if(n >= 1e3) return (n/1e3).toFixed(1).replace('.0','')+'k';
    return n.toString();
}

function updateOrCreateDataItem(key,value,isDate=false,icon=''){
    let item = [...displayElement.children].find(el=>el.dataset.key===key);
    if(!item){
        item=document.createElement('div');
        item.className='data-item';
        item.dataset.key=key;
        if(isDate) item.classList.add('date');
        item.innerHTML=`
            <span class="key">${icon?icon+' ':''}${key}</span>
            <span class="value">${isDate?value:formatNumber(value)}</span>`;
        displayElement.appendChild(item);
    } else {
        item.querySelector('.value').textContent = isDate ? value : formatNumber(value);
    }
}

function renderMilestoneChart(){
    milestoneChartEl.innerHTML='';
    milestoneLabelsEl.innerHTML='';

    MILESTONES.forEach((m,i)=>{
        const step = document.createElement('div');
        step.className='milestone-step' + (milestonesReached.includes(m)?' completed':'');
        step.textContent = i+1;

        step.onclick = ()=>{
            if(milestonesReached.includes(m)){
                showMilestone(m);
            } else {
                alert(`You need ${formatNumber(m)} visits to unlock this milestone!`);
            }
        };

        milestoneChartEl.appendChild(step);

        const label = document.createElement('div');
        label.style.flex='1';
        label.style.textAlign=i===0?'left':i===MILESTONES.length-1?'right':'center';
        label.textContent = formatNumber(m);
        milestoneLabelsEl.appendChild(label);
    });
}

async function updateStats(){
    try{
        const res = await fetch(
            `https://api.allorigins.win/get?url=` +
            encodeURIComponent(`https://neocities.org/api/info?sitename=${SITE_NAME}`)
        );
        const info = JSON.parse((await res.json()).contents).info;
        const opts = {month:'numeric',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true};

        updateOrCreateDataItem('Date Created', new Date(info.created_at).toLocaleString(undefined,opts), true);
        updateOrCreateDataItem('Last Updated', new Date(info.last_updated).toLocaleString(undefined,opts), true);
        updateOrCreateDataItem('Visits', info.views, false);
        updateOrCreateDataItem('Hits', info.hits, false);

        const next = MILESTONES[currentMilestoneIndex];
        if(next && info.views >= next){
            milestonesReached.push(next);
            localStorage.setItem("milestonesReached", JSON.stringify(milestonesReached));
            currentMilestoneIndex++;
            showMilestone(next);
        }

        goalLabel.textContent = MILESTONES[currentMilestoneIndex]
            ? `Next Milestone: ${formatNumber(MILESTONES[currentMilestoneIndex])} Visits`
            : `All Milestones Completed 🎉`;

        renderMilestoneChart();

    } catch {
        goalLabel.textContent = 'Error fetching stats…';
    }
}

function showMilestone(value){
    milestoneContainer.style.display='block';
    const ctx = milestoneCanvas.getContext('2d');
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.src = "/Images/goal-reached.png";

    img.onload = () => {
        milestoneCanvas.width = img.width;
        milestoneCanvas.height = img.height;

        ctx.clearRect(0,0,img.width,img.height);
        ctx.drawImage(img,0,0);

        const centerX = img.width / 2;
        const centerY = img.height / 2;
        const circleRadius = img.width * 0.35;

        ctx.beginPath();
        ctx.arc(centerX, centerY, circleRadius, 0, Math.PI*2);
        ctx.fillStyle = "rgba(0,0,0,0.55)";
        ctx.fill();

        function drawTextInsideCircle(text, maxWidthRatio, yOffset, color){
            let fontSize = circleRadius / 3;
            ctx.font = `bold ${fontSize}px Inter`;
            ctx.fillStyle = color;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            while(ctx.measureText(text).width > circleRadius * maxWidthRatio){
                fontSize -= 2;
                ctx.font = `bold ${fontSize}px Inter`;
            }
            ctx.fillText(text, centerX, centerY + yOffset);
        }

        drawTextInsideCircle("MILESTONE REACHED", 1.5, -circleRadius/4, "#FFD700");
        drawTextInsideCircle(`${formatNumber(value)} VISITS`, 1.5, circleRadius/6, "#FFFFFF");
    };

    downloadBtn.onclick = () => {
        const link = document.createElement("a");
        link.download = `milestone-${formatNumber(value)}.png`;
        link.href = milestoneCanvas.toDataURL("image/png");
        link.click();
    };
}

updateStats();
setInterval(updateStats, UPDATE_INTERVAL);
</script>

<!-- Gold JS just called, no color overrides, deferred -->
<script src="/js/disable-zoom.js"></script>
<script src="/js/Tier.js"></script>

<script src="/js/Bottom-bar.js"></script>
<script src="/js/trust-pilot.js"></script>

</body>
</html>
