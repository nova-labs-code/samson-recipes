<!DOCTYPE html>
<script src="/js/security.js" type="module"></script>
<html lang="en">

<head>
  <link rel="manifest" href="/manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Samson Blogs</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto&family=Courier+Prime&family=Montserrat&family=Pacifico&display=swap');

    html {
      scroll-behavior: smooth;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    a {
      color: inherit;
      text-decoration: none;
      outline: none;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0d0e12;
      margin: 0;
      padding: 16px;
      color: #cbd5e1;
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      max-width: 900px;
      margin: auto;
      width: 100%;
      box-sizing: border-box;
    }

    h1 {
      text-align: center;
      margin-top: 10px;
      margin-bottom: 20px;
      color: #f1f5f9;
      font-weight: 700;
      font-size: clamp(24px, 5vw, 36px);
      letter-spacing: -0.5px;
    }

    #search {
      width: 100%;
      box-sizing: border-box;
      padding: 14px 18px;
      margin-bottom: 20px;
      border-radius: 10px;
      border: 1px solid #272a34;
      background-color: #161920;
      color: #f1f5f9;
      font-size: 16px; /* Prevents auto-zoom on iOS safari */
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    #search:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    #search::placeholder {
      color: #64748b;
    }

    .blog {
      background: #161920;
      padding: 20px;
      margin-bottom: 16px;
      border-radius: 12px;
      border: 1px solid #1e222b;
      box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.25);
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      cursor: pointer;
    }

    .blog:hover {
      border-color: #2e3545;
      box-shadow: 0px 8px 30px rgba(0, 0, 0, 0.4);
    }

    .blog-header {
      display: flex;
      justify-content: space-between;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 8px;
    }

    @media (min-width: 600px) {
      body {
        padding: 24px;
      }
      .blog {
        padding: 24px;
        margin-bottom: 20px;
      }
      .blog-header {
        flex-direction: row;
        align-items: baseline;
        gap: 16px;
      }
    }

    .blog-title {
      font-size: clamp(18px, 4vw, 24px);
      font-weight: bold;
      color: #f8fafc;
      line-height: 1.3;
      margin-bottom: 4px;
    }

    .blog-author {
      font-style: italic;
      font-size: 14px;
      color: #94a3b8;
    }

    .blog-date {
      font-size: 13px;
      color: #64748b;
      font-weight: 500;
      margin-top: 2px;
    }

    .blog-content {
      font-size: 15px;
      line-height: 1.6;
      color: #cbd5e1;
      display: none;
      padding-top: 14px;
      margin-top: 14px;
      border-top: 1px solid #232733;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }
  </style>
  <script type="module" src="/js/profile.js"></script>
</head>

<body>

  <div class="container">
    <h1>Samson Blogs</h1>
    <input type="text" id="search" placeholder="Search blogs by title, author, or content...">
    <div id="blogs"></div>
  </div>

  <script>
    let blogData = [];
    let openBlogId = null;
    let lastJSONHash = null;

    async function fetchBlogs() {
      try {
        const res = await fetch('/json/blogs.json', { cache: "no-store" });
        const data = await res.json();

        const hash = JSON.stringify(data);

        // Only update DOM if underlying JSON changed
        if (hash !== lastJSONHash) {
          lastJSONHash = hash;

          blogData = data;
          blogData.sort((a, b) => b.id - a.id);

          filterAndRender();
        }

      } catch (err) {
        console.warn('blogs.json not loaded:', err);
      }
    }

    function startLiveUpdates() {
      fetchBlogs(); // initial load

      setInterval(() => {
        fetchBlogs();
      }, 1000);
    }

    function filterAndRender() {
      const term = document.getElementById('search').value.toLowerCase().trim();

      const filtered = blogData.filter(blog =>
        (blog.title && blog.title.toLowerCase().includes(term)) ||
        (blog.author && blog.author.toLowerCase().includes(term)) ||
        (blog.content && blog.content.toLowerCase().includes(term))
      );

      renderBlogs(filtered);
    }

    function renderBlogs(blogs) {
      const container = document.getElementById('blogs');
      container.innerHTML = '';

      if (blogs.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px 0; color: #64748b;">No blogs found matching your search.</div>';
        return;
      }

      blogs.forEach(blog => {
        const div = document.createElement('div');
        div.className = 'blog';
        div.dataset.id = blog.id;

        const isOpen = (openBlogId === blog.id);

        div.innerHTML = `
          <div class="blog-header">
            <div>
              <div class="blog-title">${blog.title}</div>
              <div class="blog-author">By ${blog.author}</div>
            </div>
            <div class="blog-date">${blog.date}</div>
          </div>

          <div class="blog-content" style="display: ${isOpen ? 'block' : 'none'};">
            ${blog.content}
          </div>
        `;

        div.addEventListener('click', () => toggleBlog(blog.id));
        container.appendChild(div);
      });
    }

    function toggleBlog(id) {
      if (openBlogId === id) {
        openBlogId = null;
      } else {
        openBlogId = id;
      }
      filterAndRender();
    }

    document.getElementById('search').addEventListener('input', filterAndRender);

    startLiveUpdates();
  </script>

  <script type="module" src="/js/disable-zoom.js"></script>
  <script type="module" src="/js/Bottom-bar.js"></script>

</body>

</html>
