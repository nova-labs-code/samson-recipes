<!DOCTYPE html>
<html lang="en">
<script src="./not_found.js"></script>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Samson Recipes</title>
  <script src="./js/icon.js"></script>
  <style>
    body:not(.original) {
      font-family: "Segoe UI", Arial, sans-serif;
      margin: 0;
      padding: 0;

    }

    html {
      scroll-behavior: smooth;
    }

    h1:not(.original) {
      text-align: center;
      font-family: "Comic Sans MS";
      font-size: 26px;
      margin: 1em 0;
    }

    p:not(.original) {
      text-align: center;
      font-size: 20px;
      margin: 0.5em 0;
    }

    hr:not(.original) {
      margin: 20px 0;
    }

    li:not(.original) {
      font-size: 21px;
      margin-bottom: 0.4em;
      margin-left: .5em;
    }

    ol:not(.original) {
      list-style-type: decimal-leading-zero;
    }

    /* -------------------- */
    /* IMAGES */
    img:not(.original) {
      display: block;
      margin: 0 auto;
      border-radius: 25px;
      width: 285px;
      height: 285px;
      object-fit: cover;
      max-width: 90vw;
      max-height: 90vw;
    }

    /* -------------------- */
    /* GALLERY */
    #imageGallery:not(.original) {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin: 10px 0;
    }

    #imageGallery img:not(.original) {
      width: 220px;
      height: 220px;
      border-radius: 14px;
      object-fit: cover;
    }

    /* -------------------- */
    .margin:not(.original) {
      margin-left: 18px;
    }

    /* 🎠 CAROUSEL */
    .carousel-container:not(.original) {
      position: relative;
    }

    .carousel-images img:not(.original) {
      display: none;
      width: 220px;
      height: 220px;
      border-radius: 14px;
      object-fit: cover;
    }

    .carousel-images img.active:not(.original) {
      display: block;
      margin: 0 auto;
    }

    .carousel-dots:not(.original) {
      text-align: center;
      margin-top: 10px;
    }

    .carousel-dot:not(.original) {
      display: inline-block;
      width: 10px;
      height: 10px;
      margin: 0 4px;
      border-radius: 50%;
      background: #bbb;
      cursor: pointer;
    }

    .carousel-dot.active:not(.original) {
      background: #111;
    }

    /* ⏱️ TIME GRID */
    .time-grid:not(.original) {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      text-align: center;
    }

    .time-box:not(.original) {
      width: 110px;
      /* instead of min-width */
      padding: 10px;
      box-sizing: border-box;
    }

    .time-box h1:not(.original) {
      font-size: 18px;
      margin: 0;
    }

    /* -------------------- */
    /* NAV */
    .page-nav:not(.original) {
      text-align: center;
      margin: 1em 0;
      font-size: 20px;
    }

    .page-nav a:not(.original) {
      margin: 0 10px;
      text-decoration: underline;
      font-weight: bold;
      color: black;
      cursor: pointer;
    }

    /* -------------------- */
    /* BACK TO TOP */
  </style>

  <script src="/site_down.js" defer></script>
</head>

<body data-maintenance="minor"></body>

<body>

  <div id="app">
    <div style="text-align:center;margin-top:120px;">
      Loading recipe...
    </div>
  </div>

  <script>

    /* =========================
       ⏱️ TIME ENGINE (RESTORED)
    ========================= */

    function parseTime(str) {
      if (!str) return null;

      const parts = String(str)
        .split(",")
        .map(n => parseInt(n.trim()))
        .filter(n => !isNaN(n));

      if (!parts.length) return null;

      if (parts.length === 2) return { min: parts[0], max: parts[1] };

      return { min: parts[0], max: parts[0] };
    }

    function format(sec) {
      let s = sec;
      const y = Math.floor(s / 31536000); s %= 31536000;
      const d = Math.floor(s / 86400); s %= 86400;
      const h = Math.floor(s / 3600); s %= 3600;
      const m = Math.floor(s / 60); s %= 60;

      const out = [];
      if (y) out.push(`${y}y`)
      if (d) out.push(`${d}d`);
      if (h) out.push(`${h}h`);
      if (m) out.push(`${m}m`);
      if (s) out.push(`${s}s`);

      return out.join(" ") || "0s";
    }

    function formatRange(obj) {
      if (!obj) return "";
      return obj.min === obj.max
        ? format(obj.min)
        : `${format(obj.min)} - ${format(obj.max)}`;
    }

    function renderTime(prep, cook, melt, chill, total) {
      if (!prep && !cook && !melt && !chill && !total) return "";

      return (prep || cook || melt || chill || total) ? `
  <div id="time">
    <h1>Time</h1>

    <div class="time-grid">

      ${prep ? `
        <div class="time-box">
          <h1>Prep</h1>
          <h1>${formatRange(prep)}</h1>
        </div>` : ""}

      ${cook ? `
        <div class="time-box">
          <h1>Cook</h1>
          <h1>${formatRange(cook)}</h1>
        </div>` : ""}

      ${melt ? `
        <div class="time-box">
          <h1>Melt</h1>
          <h1>${formatRange(melt)}</h1>
        </div>` : ""}

      ${chill ? `
        <div class="time-box">
          <h1>Chill</h1>
          <h1>${formatRange(chill)}</h1>
        </div>` : ""}

      ${total ? `
        <div class="time-box">
          <h1>Total</h1>
          <h1>${formatRange(total)}</h1>
        </div>` : ""}

    </div>
  </div>
` : "";
    }
    /* =========================
       🎠 CAROUSEL (UNCHANGED FIXED)
    ========================= */

    (function () {

      function initCarousel() {
        const wrapper = document.querySelector("#imageGallery");
        if (!wrapper) return;

        const images = Array.from(wrapper.querySelectorAll("img"));
        if (images.length <= 1) return;

        if (wrapper.dataset.carouselReady === "true") return;
        wrapper.dataset.carouselReady = "true";

        images.forEach(img => img.classList.remove("active"));
        images[0].classList.add("active");

        const imagesWrapper = document.createElement("div");
        imagesWrapper.className = "carousel-images";

        const dots = document.createElement("div");
        dots.className = "carousel-dots";

        images.forEach((img, i) => {
          imagesWrapper.appendChild(img);

          const dot = document.createElement("span");
          dot.className = "carousel-dot" + (i === 0 ? " active" : "");

          dot.onclick = () => {
            images.forEach(i => i.classList.remove("active"));
            dots.querySelectorAll(".carousel-dot")
              .forEach(d => d.classList.remove("active"));

            img.classList.add("active");
            dot.classList.add("active");
          };

          dots.appendChild(dot);
        });

        const container = document.createElement("div");
        container.className = "carousel-container";
        container.appendChild(imagesWrapper);
        container.appendChild(dots);

        wrapper.innerHTML = "";
        wrapper.appendChild(container);
      }

      window.initCarousel = initCarousel;

    })();
    function formatNames(str) {
      const names = str.split(",").map(n => n.trim()).filter(Boolean);

      if (names.length <= 1) return names[0] || "";
      if (names.length === 2) return `${names[0]} and ${names[1]}`;

      return `${names.slice(0, -1).join(", ")} and ${names[names.length - 1]}`;
    }
    /* =========================
       🚀 LOAD RECIPE
    ========================= */

    function initBackToStart() {
      const title = document.getElementById("Title");
      if (!title) return;

      if (document.getElementById("back-to-start")) return;

      const button = document.createElement("button");
      button.id = "back-to-start";
      button.textContent = "Back To Top";
      button.className = "no-print";
      Object.assign(button.style, {
        position: "fixed",
        bottom: "20px",
        right: "20px",
        zIndex: "2147483647",

        padding: "10px 20px",
        borderRadius: "10px",
        border: "none",
        cursor: "pointer",
        fontWeight: "bold",

        backgroundColor: "#a855f7",
        color: "#fff",
        boxShadow: "0 0 18px rgba(168,85,247,0.5)",

        opacity: "0",
        pointerEvents: "none",
        transform: "translateY(10px) scale(0.95)",
        transition: "opacity 0.2s, transform 0.2s"
      });

      function update() {
        const t = document.getElementById("Title");
        if (!t) return;

        const scrollY = window.scrollY || document.documentElement.scrollTop;
        const showAfter = t.offsetTop + t.offsetHeight + 100;

        const show = scrollY > showAfter;

        button.style.opacity = show ? "1" : "0";
        button.style.pointerEvents = show ? "auto" : "none";
        button.style.transform = show
          ? "translateY(0) scale(1)"
          : "translateY(10px) scale(0.95)";
      }

      button.addEventListener("click", () => {
        const t = document.getElementById("Title");
        if (!t) return;

        window.scrollTo({
          top: t.offsetTop,
          behavior: "smooth"
        });
      });

      document.body.appendChild(button);

      window.addEventListener("scroll", update);
      window.addEventListener("resize", update);

      // 🔁 keeps it alive even when #app rewrites page
      const observer = new MutationObserver(update);
      observer.observe(document.body, { childList: true, subtree: true });

      update();
    }

    let lastRecipeData = null;
    let currentRecipeName = null;
    let pollTimer = null;
    let isPolling = false;

    function diffJSON(oldData, newData) {
      const changes = {};

      if (!oldData) return { full: true };

      const o = oldData.recipe || {};
      const n = newData.recipe || {};

      if (oldData.title !== newData.title) changes.title = true;

      if (JSON.stringify(o.ingredients) !== JSON.stringify(n.ingredients)) changes.ingredients = true;
      if (JSON.stringify(o.instructions) !== JSON.stringify(n.instructions)) changes.instructions = true;
      if (JSON.stringify(o.storage) !== JSON.stringify(n.storage)) changes.storage = true;
      if (JSON.stringify(o.serving_suggestions) !== JSON.stringify(n.serving_suggestions)) changes.serving = true;
      if (JSON.stringify(o.images) !== JSON.stringify(n.images)) changes.images = true;
      if (JSON.stringify(o.time_breakdown) !== JSON.stringify(n.time_breakdown)) changes.time = true;

      if (oldData.recipe_by !== newData.recipe_by) changes.author = true;

      return changes;
    }

    /* =========================
       🖼️ RENDER RECIPE
       (pulled out of loadRecipe so both the
       initial load AND the poll loop can call it)
    ========================= */

    function renderRecipe(data) {
      document.title = `${data.title} | ${data.site}`;
      const r = data.recipe || {};

      const prep = parseTime(r.time_breakdown?.prep_time);
      const cook = parseTime(r.time_breakdown?.cook_time);
      const melt = parseTime(r.time_breakdown?.melt_time);
      const chill = parseTime(r.time_breakdown?.chill_time);

      const total = (prep || cook || melt || chill)
        ? {
          min:
            (prep?.min || 0) +
            (cook?.min || 0) +
            (melt?.min || 0) +
            (chill?.min || 0),

          max:
            (prep?.max || 0) +
            (cook?.max || 0) +
            (melt?.max || 0) +
            (chill?.max || 0)
        }
        : null;

      const images = Array.isArray(r.images) ? r.images : [];

      let imageHTML = "";

      function renderImage(src) {
        const img = `<img src="${src}" alt="${data.title}">`;

        if (src.includes("no-image.png")) {
          return `<div class="no-print">${img}</div>`;
        }

        return img;
      }

      if (images?.length > 1) {
        imageHTML = `
      <div id="imageGallery">
        ${images.map(renderImage).join("")}
      </div>
    `;
      }
      else if (images?.length === 1) {
        imageHTML = renderImage(images[0]);
      }
      else {
        imageHTML = "";
      }

      document.getElementById("app").innerHTML = `
    <div>
     ${data.title ? `<h1 id="Title">${data.title}</h1>` : ""}
<div class="no-print">
      <p><strong>
${[
          r.difficulty,
          r.servings ? `${r.servings} Servings` : null
        ].filter(Boolean).join(" | ")}

</strong></p>
</div>
      ${imageHTML}

      <div class="page-nav">
      <div class="no-print">
${r.ingredients?.length ? `<a href="#ingredients">Ingredients</a>` : ""}

${r.instructions?.length ? `<a href="#instructions">Instructions</a>` : ""}

${r.storage?.length ? `<a href="#storage">Storage</a>` : ""}

${r.serving_suggestions?.length ? `<a href="#serving-suggestions">Serving Suggestions</a>` : ""}

${prep || cook || chill || total ? `<a href="#time">Time</a>` : ""}
</div>

</div>

<hr>

${renderTime(prep, cook, melt, chill, total)}

${r.ingredients?.length ? `
<hr>

<h1 id="ingredients"> Ingredients</h1>

${r.ingredients.map(section => {

          if (typeof section === "string") {
            return `<ul><li>${section}</li></ul>`;
          }

          return `
    <h2 class="margin">${section.title}</h2>
    <ul>
      ${(section.items || []).map(item => `<li>${item}</li>`).join("")}
    </ul>
  `;
        }).join("")}

` : ""}

${r.instructions?.length ? `
<hr>

<h1 id="instructions">Instructions</h1>

${r.instructions.map(section => {

          if (typeof section === "string") {
            return `<ul><li>${section}</li></ul>`;
          }

          return `
    <h2 class="margin">${section.title}</h2>
    <ul>
      ${(section.items || []).map(item => `<li>${item}</li>`).join("")}
    </ul>
  `;
        }).join("")}

` : ""}

${r.storage?.length ? `
<hr>

<h1 id="storage">Storage</h1>

${r.storage.map(section => {

          if (typeof section === "string") {
            return `<ul><li>${section}</li></ul>`;
          }

          return `
    <h2>${section.title}</h2>
    <ul>
      ${(section.items || []).map(item => `<li>${item}</li>`).join("")}
    </ul>
  `;
        }).join("")}

` : ""}

      ${r.serving_suggestions?.length ? `
<hr>

<h1 id="serving-suggestions">Serving Suggestions</h1>

${r.serving_suggestions.map(section => {

          if (typeof section === "string") {
            return `<ul><li>${section}</li></ul>`;
          }

          return `
    <h2>${section.title}</h2>
    <ul>
      ${(section.items || []).map(item => `<li>${item}</li>`).join("")}
    </ul>
  `;
        }).join("")}
<hr>

` : ""}

${r.recipe_by ? `
<h1>Recipe by ${formatNames(r.recipe_by)}</h1>

` : ""}

</div>
`;

      function initNavCleanup() {
        const links = document.querySelectorAll(".page-nav a");

        links.forEach(link => {
          link.addEventListener("click", (e) => {
            e.preventDefault();

            const targetId = link.getAttribute("href").replace("#", "");
            const target = document.getElementById(targetId);

            if (target) {
              target.scrollIntoView({ behavior: "smooth" });
            }

            // 🧼 remove #hash from URL instantly
            history.replaceState(
              null,
              "",
              window.location.pathname + window.location.search
            );
          });
        });

        // 🧼 if page loads with a hash, wipe it
        if (location.hash) {
          history.replaceState(
            null,
            "",
            window.location.pathname + window.location.search
          );
        }
      }

      // run it after render (important for your dynamic HTML)
      setTimeout(() => {
        initNavCleanup();
      }, 0);
      setTimeout(() => window.initCarousel?.(), 0);

      initBackToStart();
    }

    /* =========================
       🔁 LIVE-UPDATE POLLING
       Fetches the JSON every second and compares it
       against the last-known copy. Only re-renders
       when diffJSON reports an actual change.
    ========================= */

    async function fetchRecipeJSON(recipeName) {
      const res = await fetch(`./${recipeName}.json`, { cache: "no-store" });
      if (!res.ok) throw new Error("fetch failed");
      return res.json();
    }

    function startPolling(recipeName) {
      if (isPolling) return;
      isPolling = true;

      if (pollTimer) clearInterval(pollTimer);

      pollTimer = setInterval(async () => {
        try {
          const data = await fetchRecipeJSON(recipeName);
          const changes = diffJSON(lastRecipeData, data);

          if (Object.keys(changes).length > 0) {
            lastRecipeData = data;
            renderRecipe(data);
          }
        } catch {
          // Network hiccup or file momentarily unavailable —
          // just skip this tick and try again in 1s.
        }
      }, 1000);
    }

    async function loadRecipe() {
      const params = new URLSearchParams(window.location.search);
      const recipeName = params.get("Recipe");

      if (!recipeName) return window.location.replace("/index.html");

      currentRecipeName = recipeName;

      try {
        const data = await fetchRecipeJSON(recipeName);

        lastRecipeData = data;
        renderRecipe(data);
        startPolling(recipeName);

      } catch {
        setInterval(() => {
          document.getElementById("bottom-bar")?.remove();
          document.getElementById("trustpilot-bottom-bar")?.remove();
        }, 100);
        NotFound();
      }
    }

    loadRecipe();

  </script>

  <script src="/js/disable-zoom.js" defer></script>
  <script src="/js/Tier.js" defer></script>
  <script src="/js/Bottom-bar.js"></script>
  <script src="/js/trust-pilot.js"></script>
  <script src="/js/noprint.js" def></script>
</body>

</html>
