<!DOCTYPE html>
<script type="module" src="/js/security.js"></script>
<html lang="en">
<script src="/not_found.js"></script>

<head>
  <link rel="manifest" href="/manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Samson Recipes</title>
  <script src="/js/icon.js"></script>
<style>
    body:not(.original) {
      font-family: "Segoe UI", Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #11111a;
      color: #eee;
    }

    html {
      scroll-behavior: smooth;
      scrollbar-width: none;
      background: #11111a;

      /* For Internet Explorer and Edge */
      -ms-overflow-style: none;
    }

    /* For Chrome, Safari, and Opera */
    .your-container-class::-webkit-scrollbar {
      display: none;
    }

    h1:not(.original) {
      text-align: center;
      font-family: "Comic Sans MS";
      font-size: 26px;
      margin: 1em 0;
      color: #f5f3ff;
    }

    p:not(.original) {
      text-align: center;
      font-size: 20px;
      margin: 0.5em 0;
      color: #dcd8ee;
    }

    hr:not(.original) {
      margin: 20px 0;
      border-color: #2b2840;
    }

    li:not(.original) {
      font-size: 21px;
      margin-bottom: 0.4em;
      margin-left: .5em;
      color: #dedaf0;
    }

    ol:not(.original) {
      list-style-type: decimal-leading-zero;
    }

    /* -------------------- */
    /* IMAGES */
    img:not(.original) {
      display: block;
      margin: 0 auto;
      border-radius: 25px;
      width: 285px;
      height: 285px;
      object-fit: cover;
      max-width: 90vw;
      max-height: 90vw;
    }

    /* -------------------- */
    /* GALLERY */
    #imageGallery:not(.original) {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin: 10px 0;
    }

    #imageGallery img:not(.original) {
      width: 220px;
      height: 220px;
      border-radius: 14px;
      object-fit: cover;
    }

    /* -------------------- */
    .margin:not(.original) {
      margin-left: 18px;
    }

    /* carousel */
    .carousel-container:not(.original) {
      position: relative;
    }

    .carousel-images img:not(.original) {
      display: none;
      width: 220px;
      height: 220px;
      border-radius: 14px;
      object-fit: cover;
    }

    .carousel-images img.active:not(.original) {
      display: block;
      margin: 0 auto;
    }

    .carousel-dots:not(.original) {
      text-align: center;
      margin-top: 10px;
    }

    .carousel-dot:not(.original) {
      display: inline-block;
      width: 10px;
      height: 10px;
      margin: 0 4px;
      border-radius: 50%;
      background: #55516d;
      cursor: pointer;
    }

    .carousel-dot.active:not(.original) {
      background: #8b7cff;
    }

    /* TIME GRID */
    .time-grid:not(.original) {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      text-align: center;
    }

    .time-box:not(.original) {
      width: 110px;
      padding: 10px;
      box-sizing: border-box;
      background: #191827;
      border: 1px solid #2d2945;
      border-radius: 12px;
    }

    .time-box h1:not(.original) {
      font-size: 18px;
      margin: 0;
    }

    /* -------------------- */
    /* NAV */
    .page-nav:not(.original) {
      text-align: center;
      margin: 1em 0;
      font-size: 20px;
    }

    .page-nav a:not(.original) {
      margin: 0 10px;
      text-decoration: underline;
      font-weight: bold;
      color: #b8adff;
      cursor: pointer;
    }
</style>
  <script type="module" src="/js/profile.js"></script>
  <script src="/site_down.js" defer></script>
</head>

<body data-maintenance="none"></body>

<body>

  <div id="app">
    <div class="view-toggle-bar no-print"
      style="text-align: center; margin: 30px auto; max-width: 500px; display: flex; gap: 10px; padding: 0 20px;">
      <button id="toggleCollections" class="toggle-btn active"
        style="flex: 1; padding: 12px; border-radius: 30px; border: 2px solid #a855f7; font-weight: bold; cursor: pointer; background: #a855f7; color: white; transition: all 0.2s;">Browse
        Collections</button>
      <button id="toggleProfiles" class="toggle-btn"
        style="flex: 1; padding: 12px; border-radius: 30px; border: 2px solid #e2e8f0; font-weight: bold; cursor: pointer; background: white; color: #475569; transition: all 0.2s;">Browse
        Creators</button>
    </div>

    <div id="mainDisplayDeck">
      <div style="text-align:center; margin-top:80px; color: #666;">
        Loading recipe content across local and cloud partitions...
      </div>
    </div>
  </div>

  <script type="module">
    import { db } from "/js/firebase.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    /* =========================
       ⏱️ TIME ENGINE
    ========================= */

    function parseTime(str) {
      if (!str) return null;

      const parts = String(str)
        .split(",")
        .map(n => parseInt(n.trim()))
        .filter(n => !isNaN(n));

      if (!parts.length) return null;
      if (parts.length === 2) return { min: parts[0], max: parts[1] };

      return { min: parts[0], max: parts[0] };
    }

    function format(sec) {
      let s = sec;
      const y = Math.floor(s / 31536000); s %= 31536000;
      const d = Math.floor(s / 86400); s %= 86400;
      const h = Math.floor(s / 3600); s %= 3600;
      const m = Math.floor(s / 60); s %= 60;

      const out = [];
      if (y) out.push(`${y}y`)
      if (d) out.push(`${d}d`);
      if (h) out.push(`${h}h`);
      if (m) out.push(`${m}m`);
      if (s) out.push(`${s}s`);

      return out.join(" ") || "0s";
    }

    function formatRange(obj) {
      if (!obj) return "";
      return obj.min === obj.max
        ? format(obj.min)
        : `${format(obj.min)} - ${format(obj.max)}`;
    }

    function renderTime(prep, cook, melt, chill, total) {
      if (!prep && !cook && !melt && !chill && !total) return "";

      return `
  <div id="time">
    <h1>Time</h1>
    <div class="time-grid">
      ${prep ? `<div class="time-box"><h1>Prep</h1><h1>${formatRange(prep)}</h1></div>` : ""}
      ${cook ? `<div class="time-box"><h1>Cook</h1><h1>${formatRange(cook)}</h1></div>` : ""}
      ${melt ? `<div class="time-box"><h1>Melt</h1><h1>${formatRange(melt)}</h1></div>` : ""}
      ${chill ? `<div class="time-box"><h1>Chill</h1><h1>${formatRange(chill)}</h1></div>` : ""}
      ${total ? `<div class="time-box"><h1>Total</h1><h1>${formatRange(total)}</h1></div>` : ""}
    </div>
  </div>`;
    }

    /* =========================
       🎠 CAROUSEL
    ========================= */

    (function () {
      function initCarousel() {
        const wrapper = document.querySelector("#imageGallery");
        if (!wrapper) return;

        const images = Array.from(wrapper.querySelectorAll("img"));
        if (images.length <= 1) return;

        if (wrapper.dataset.carouselReady === "true") return;
        wrapper.dataset.carouselReady = "true";

        images.forEach(img => img.classList.remove("active"));
        images[0].classList.add("active");

        const imagesWrapper = document.createElement("div");
        imagesWrapper.className = "carousel-images";

        const dots = document.createElement("div");
        dots.className = "carousel-dots";

        images.forEach((img, i) => {
          imagesWrapper.appendChild(img);
          const dot = document.createElement("span");
          dot.className = "carousel-dot" + (i === 0 ? " active" : "");

          dot.onclick = () => {
            images.forEach(i => i.classList.remove("active"));
            dots.querySelectorAll(".carousel-dot").forEach(d => d.classList.remove("active"));
            img.classList.add("active");
            dot.classList.add("active");
          };
          dots.appendChild(dot);
        });

        const container = document.createElement("div");
        container.className = "carousel-container";
        container.appendChild(imagesWrapper);
        container.appendChild(dots);

        wrapper.innerHTML = "";
        wrapper.appendChild(container);
      }
      window.initCarousel = initCarousel;
    })();

    function formatNames(str) {
      const names = str.split(",").map(n => n.trim()).filter(Boolean);
      if (names.length <= 1) return names[0] || "";
      if (names.length === 2) return `${names[0]} and ${names[1]}`;
      return `${names.slice(0, -1).join(", ")} and ${names[names.length - 1]}`;
    }

    /* =========================
       🚀 LOAD RECIPE Engine
    ========================= */

    function initBackToStart() {
      const title = document.getElementById("Title");
      if (!title || document.getElementById("back-to-start")) return;

      const button = document.createElement("button");
button.id = "back-to-start";
button.textContent = "Back To Top";
button.className = "no-print";

Object.assign(button.style, {
  position: "fixed",
  bottom: "20px",
  right: "20px",
  zIndex: "2147483647",
  padding: "10px 20px",
  borderRadius: "10px",
  border: "none",
  cursor: "pointer",
  fontWeight: "bold",
  backgroundColor: "#211E1E",
  color: "#fff",
  boxShadow: "0 0 18px rgba(0,0,0,0.5)",
  opacity: "0",
  pointerEvents: "none",
  transform: "translateY(10px) scale(0.95)",
  transition: "opacity 0.2s, transform 0.2s, background-color 0.2s, box-shadow 0.2s"
});

// Hover animation
button.addEventListener("mouseenter", () => {
  button.style.transform = "translateY(0) scale(1.05)";
  button.style.backgroundColor = "#302B2B";
  button.style.boxShadow = "0 0 25px rgba(0,0,0,0.7)";
});

button.addEventListener("mouseleave", () => {
  button.style.transform = "translateY(0) scale(1)";
  button.style.backgroundColor = "#211E1E";
  button.style.boxShadow = "0 0 18px rgba(0,0,0,0.5)";
});

      function update() {
        const t = document.getElementById("Title");
        if (!t) return;
        const scrollY = window.scrollY || document.documentElement.scrollTop;
        const show = scrollY > (t.offsetTop + t.offsetHeight + 100);
        button.style.opacity = show ? "1" : "0";
        button.style.pointerEvents = show ? "auto" : "none";
        button.style.transform = show ? "translateY(0) scale(1)" : "translateY(10px) scale(0.95)";
      }

      button.addEventListener("click", () => {
        const t = document.getElementById("Title");
        if (t) window.scrollTo({ top: t.offsetTop, behavior: "smooth" });
      });

      document.body.appendChild(button);
      window.addEventListener("scroll", update);
      window.addEventListener("resize", update);

      const observer = new MutationObserver(update);
      observer.observe(document.body, { childList: true, subtree: true });
      update();
    }

    let lastRecipeData = null;
    let currentRecipeName = null;
    let pollTimer = null;
    let isPolling = false;
    let dataSource = "local"; // Tracks "local" or "firebase" to focus updates correctly

    function diffJSON(oldData, newData) {
      if (!oldData) return { full: true };
      const changes = {};
      const o = oldData.recipe || oldData.recipeData?.recipe || {};
      const n = newData.recipe || newData.recipeData?.recipe || {};

      const oldTitle = oldData.title || oldData.name || "";
      const newTitle = newData.title || newData.name || "";
      if (oldTitle !== newTitle) changes.title = true;

      if (JSON.stringify(o.ingredients) !== JSON.stringify(n.ingredients)) changes.ingredients = true;
      if (JSON.stringify(o.instructions) !== JSON.stringify(n.instructions)) changes.instructions = true;
      if (JSON.stringify(o.storage) !== JSON.stringify(n.storage)) changes.storage = true;
      if (JSON.stringify(o.serving_suggestions) !== JSON.stringify(n.serving_suggestions)) changes.serving = true;
      if (JSON.stringify(o.images) !== JSON.stringify(n.images)) changes.images = true;
      if (JSON.stringify(o.time_breakdown) !== JSON.stringify(n.time_breakdown)) changes.time = true;

      const oldAuthor = o.recipe_by || oldData.recipe_by || "";
      const newAuthor = n.recipe_by || newData.recipe_by || "";
      if (oldAuthor !== newAuthor) changes.author = true;

      return changes;
    }

    function renderRecipe(rawPayload) {
      // Normalizes schema differences between local JSON files and Firebase data mappings
      const data = rawPayload.recipeData ? rawPayload.recipeData : rawPayload;
      const titleText = rawPayload.name || data.title || "";
      document.title = `${titleText} | ${data.site || "Samson Recipes"}`;

      const r = data.recipe || {};

      const prep = parseTime(r.time_breakdown?.prep_time);
      const cook = parseTime(r.time_breakdown?.cook_time);
      const melt = parseTime(r.time_breakdown?.melt_time);
      const chill = parseTime(r.time_breakdown?.chill_time);

      const total = (prep || cook || melt || chill)
        ? {
          min: (prep?.min || 0) + (cook?.min || 0) + (melt?.min || 0) + (chill?.min || 0),
          max: (prep?.max || 0) + (cook?.max || 0) + (melt?.max || 0) + (chill?.max || 0)
        }
        : null;

      const images = Array.isArray(r.images) ? r.images : (rawPayload.image ? [rawPayload.image] : []);
      let imageHTML = "";

      function renderImage(src) {
        const img = `<img src="${src}" alt="${titleText}">`;
        return src.includes("no-image.png") ? `<div class="no-print">${img}</div>` : img;
      }

      if (images.length > 1) {
        imageHTML = `<div id="imageGallery">${images.map(renderImage).join("")}</div>`;
      } else if (images.length === 1) {
        imageHTML = renderImage(images[0]);
      }

      document.getElementById("app").innerHTML = `
    <div>
      ${titleText ? `<h1 id="Title">${titleText}</h1>` : ""}
      <div class="no-print">
        <p><strong>${[r.difficulty || rawPayload.difficulty, r.servings ? `${r.servings} Servings` : null].filter(Boolean).join(" | ")}</strong></p>
      </div>
      ${imageHTML}
      <div class="page-nav">
        <div class="no-print">
          ${r.ingredients?.length ? `<a href="#ingredients">Ingredients</a>` : ""}
          ${r.instructions?.length ? `<a href="#instructions">Instructions</a>` : ""}
          ${r.storage?.length ? `<a href="#storage">Storage</a>` : ""}
          ${r.serving_suggestions?.length ? `<a href="#serving-suggestions">Serving Suggestions</a>` : ""}
          ${prep || cook || chill || total ? `<a href="#time">Time</a>` : ""}
        </div>
      </div>
      <hr>
      ${renderTime(prep, cook, melt, chill, total)}
      ${r.ingredients?.length ? `<hr><h1 id="ingredients">Ingredients</h1>${r.ingredients.map(section => typeof section === "string" ? `<ul><li>${section}</li></ul>` : `<h2 class="margin">${section.title}</h2><ul>${(section.items || []).map(item => `<li>${item}</li>`).join("")}</ul>`).join("")}` : ""}
      ${r.instructions?.length ? `<hr><h1 id="instructions">Instructions</h1>${r.instructions.map(section => typeof section === "string" ? `<ul><li>${section}</li></ul>` : `<h2 class="margin">${section.title}</h2><ul>${(section.items || []).map(item => `<li>${item}</li>`).join("")}</ul>`).join("")}` : ""}
      ${r.storage?.length ? `<hr><h1 id="storage">Storage</h1>${r.storage.map(section => typeof section === "string" ? `<ul><li>${section}</li></ul>` : `<h2>${section.title}</h2><ul>${(section.items || []).map(item => `<li>${item}</li>`).join("")}</ul>`).join("")}` : ""}
      ${r.serving_suggestions?.length ? `<hr><h1 id="serving-suggestions">Serving Suggestions</h1>${r.serving_suggestions.map(section => typeof section === "string" ? `<ul><li>${section}</li></ul>` : `<h2>${section.title}</h2><ul>${(section.items || []).map(item => `<li>${item}</li>`).join("")}</ul>`).join("")}<hr>` : ""}
      ${r.recipe_by ? `<h1>Recipe by ${formatNames(r.recipe_by)}</h1>` : ""}
    </div>`;

      function initNavCleanup() {
        document.querySelectorAll(".page-nav a").forEach(link => {
          link.addEventListener("click", (e) => {
            e.preventDefault();
            const target = document.getElementById(link.getAttribute("href").replace("#", ""));
            if (target) target.scrollIntoView({ behavior: "smooth" });
            history.replaceState(null, "", window.location.pathname + window.location.search);
          });
        });
        if (location.hash) history.replaceState(null, "", window.location.pathname + window.location.search);
      }

      setTimeout(() => initNavCleanup(), 0);
      setTimeout(() => window.initCarousel?.(), 0);
      initBackToStart();
    }

    /* =========================
       🔁 LOCAL / CLOUD DISTRIBUTED POLLING STRATEGY
    ========================= */

    async function fetchRecipeJSON(recipeName) {
      if (dataSource === "local") {
        try {
          const res = await fetch(`./${recipeName}.json`, { cache: "no-store" });
          if (!res.ok) throw new Error("Local fallback required");
          return await res.json();
        } catch (err) {
          // If local resolution fails, flip state tracker over to check Cloud Firestore
          dataSource = "firebase";
          return await fetchFirebaseRecipe(recipeName);
        }
      } else {
        return await fetchFirebaseRecipe(recipeName);
      }
    }

    async function fetchFirebaseRecipe(recipeName) {
      // Slugifies variations like spaces into cleaner lookup patterns matching your ID structures
      const slugId = recipeName.toLowerCase().replace(/%20/g, "-").replace(/\s+/g, "-");
      const docSnap = await getDoc(doc(db, "recipes", slugId));
      if (docSnap.exists()) {
        return docSnap.data();
      }
      throw new Error("Recipe missing across all distributed storage segments");
    }

    function startPolling(recipeName) {
      if (isPolling) return;
      isPolling = true;
      if (pollTimer) clearInterval(pollTimer);

      pollTimer = setInterval(async () => {
        try {
          const data = await fetchRecipeJSON(recipeName);
          const changes = diffJSON(lastRecipeData, data);

          if (Object.keys(changes).length > 0) {
            lastRecipeData = data;
            renderRecipe(data);
          }
        } catch (err) {
          // Network fluctuation catch block
        }
      }, 1000);
    }

    async function loadRecipe() {
      const params = new URLSearchParams(window.location.search);
      const recipeName = params.get("Recipe");

      if (!recipeName) return window.location.replace("/index.html");
      currentRecipeName = recipeName;

      try {
        const data = await fetchRecipeJSON(recipeName);
        lastRecipeData = data;
        renderRecipe(data);
        startPolling(recipeName);
      } catch (err) {
        setInterval(() => {
          document.getElementById("bottom-bar")?.remove();
          document.getElementById("trustpilot-bottom-bar")?.remove();
        }, 100);
        NotFound();
      }
    }

    loadRecipe();
  </script>

  <script src="/js/disable-zoom.js" defer></script>
  <script src="/js/Bottom-bar.js" type="module"></script>
  <script src="/js/noprint.js" def></script>
  <script src="/js/wake.js"></script>
</body>

</html>
